<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 투두 리스트</title>
    <!-- Tailwind CSS를 CDN으로 불러와 깔끔한 디자인 적용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 체크박스 커스텀 애니메이션 */
        .todo-item { transition: all 0.2s ease-in-out; }
        .completed-text { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">✅ 오늘의 할 일</h1>
            <span id="taskCount" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0개 남음</span>
        </div>

        <!-- 입력 창 -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="todoInput" 
                class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full p-3 outline-none transition-shadow" 
                placeholder="새로운 할 일을 입력하세요..."
                autocomplete="off">
            <button id="addButton" 
                class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-xl text-sm px-5 py-3 transition-colors">
                추가
            </button>
        </div>

        <!-- 투두 리스트 출력 영역 -->
        <ul id="todoList" class="space-y-3">
            <!-- 자바스크립트를 통해 여기에 할 일들이 추가됩니다 -->
        </ul>
        
        <!-- 데이터 초기화 안내 -->
        <p class="text-xs text-gray-400 text-center mt-6">
            데이터는 현재 브라우저에 안전하게 자동 저장됩니다.
        </p>
    </div>

    <script>
        // DOM 요소 가져오기
        const todoInput = document.getElementById('todoInput');
        const addButton = document.getElementById('addButton');
        const todoList = document.getElementById('todoList');
        const taskCount = document.getElementById('taskCount');

        // 로컬 스토리지에서 투두 데이터 불러오기 (없으면 빈 배열)
        let todos = JSON.parse(localStorage.getItem('myTodos')) || [];

        // 화면에 투두 리스트 렌더링하는 함수
        function renderTodos() {
            todoList.innerHTML = '';
            let remainingCount = 0;

            todos.forEach((todo, index) => {
                if (!todo.completed) remainingCount++;

                const li = document.createElement('li');
                li.className = `todo-item flex items-center justify-between p-3 rounded-xl border ${todo.completed ? 'bg-gray-50 border-gray-200' : 'bg-white border-gray-200 shadow-sm'}`;
                
                li.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 overflow-hidden">
                        <input type="checkbox" 
                            class="w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 cursor-pointer flex-shrink-0"
                            ${todo.completed ? 'checked' : ''} 
                            onchange="toggleTodo(${index})">
                        <span class="truncate text-sm sm:text-base ${todo.completed ? 'completed-text' : 'text-gray-700'} cursor-pointer" onclick="toggleTodo(${index})">
                            ${todo.text}
                        </span>
                    </div>
                    <button onclick="deleteTodo(${index})" class="text-gray-400 hover:text-red-500 transition-colors p-1 flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                todoList.appendChild(li);
            });

            // 남은 할 일 개수 업데이트
            taskCount.textContent = `${remainingCount}개 남음`;
            
            // 로컬 스토리지에 저장
            localStorage.setItem('myTodos', JSON.stringify(todos));
        }

        // 새로운 투두 추가 함수
        function addTodo() {
            const text = todoInput.value.trim();
            if (text !== '') {
                todos.push({ text: text, completed: false });
                todoInput.value = '';
                renderTodos();
            }
        }

        // 투두 완료 상태 토글 함수
        window.toggleTodo = function(index) {
            todos[index].completed = !todos[index].completed;
            renderTodos();
        }

        // 투두 삭제 함수
        window.deleteTodo = function(index) {
            todos.splice(index, 1);
            renderTodos();
        }

        // 이벤트 리스너: 추가 버튼 클릭
        addButton.addEventListener('click', addTodo);

        // 이벤트 리스너: 엔터키 입력 시 추가
        todoInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        // 초기 화면 렌더링
        renderTodos();
    </script>
</body>
</html>
